name: Feature request
description: Suggest an improvement to the public Aethmere product.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result you want without relying on internal implementation details.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include private memories, credentials, personal data, or confidential project content.
